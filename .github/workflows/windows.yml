name: windows
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  test:
    name: Node.js 24 on windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm test
