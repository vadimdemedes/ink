name: test
on: [push, pull_request]
jobs:
  test:
    name: Node.js ${{ matrix.node_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - 24
          - 22
        os:
          - ubuntu-latest
        include:
          - node_version: 24
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
      - run: npm install
      - run: npm test
        env:
          FORCE_COLOR: true
